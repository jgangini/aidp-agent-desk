[project]
name = "agent-desk"
version = "0.1.2"
requires-python = ">=3.12,<3.14"
dependencies = [
    "authlib>=1.6,<2",
    "cryptography>=50.0.2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "joserfc>=1.8,<2",
    "oci>=2.190,<3",
    "python-multipart>=0.0.33",
    "tzdata>=2026.6",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.uv]
package = false


